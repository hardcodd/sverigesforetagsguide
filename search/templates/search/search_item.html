{% load wagtailcore_tags %}

<article class="search-item">
  <div class="search-item__content">
    <h2 class="search-item__title"><a href="{% pageurl result %}" class="search-item__link">{{ result }}</a></h2>
    {% if result.search_description %}<p class="search-item__description">{{ result.search_description|truncatechars:160 }}</p>{% endif %}
  </div>
</article>
